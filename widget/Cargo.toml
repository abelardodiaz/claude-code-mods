[package]
name = "flota-widget"
version = "0.1.0"
description = "Widget nativo de Windows (Win32 + GDI, sin WebView) con las sesiones de Claude Code y la salud de tus maquinas"
authors = ["Abelardo Diaz"]
license = "MIT"
repository = "https://github.com/abelardodiaz/claude-code-mods"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "flota-widget"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
